# GraalVM native-image build arguments for opendataloader-pdf.
#
# Embedded in the CLI jar so they apply to BOTH `native-image -jar ...` and the
# native-maven-plugin build. Reachability metadata (reflect/resource/jni) lives
# alongside this file and is picked up automatically.
Args = --no-fallback \
       -H:+ReportExceptionStackTraces \
       -Djava.awt.headless=true \
       -Dfile.encoding=UTF-8 \
       --enable-url-protocols=http,https \
       -H:+AddAllCharsets \
       --initialize-at-run-time=java.awt,sun.awt,sun.java2d,sun.font,javax.imageio,com.sun.imageio
