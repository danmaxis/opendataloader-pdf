# GraalVM native-image build arguments for opendataloader-pdf.
#
# Embedded in the CLI jar so they apply to BOTH `native-image -jar ...` and the
# native-maven-plugin build. Reachability metadata (reflect/resource/jni) lives
# alongside this file and is picked up automatically.
#
# Encoding note: native-image freezes sun.jnu.encoding (the charset used to
# decode command-line args and filesystem paths) at BUILD time from the build
# machine's locale, and never re-reads the runtime locale. CI/Docker builds run
# in a C/POSIX locale, which would bake it to ASCII and make non-ASCII paths
# (e.g. "Dimensões.pdf") fail to open. Pinning -Dsun.jnu.encoding=UTF-8 here is
# the authoritative fix; -Dfile.encoding=UTF-8 keeps I/O consistent and
# -H:+AddAllCharsets ensures UTF-8 is actually included in the image.
Args = --no-fallback \
       -H:+ReportExceptionStackTraces \
       -Djava.awt.headless=true \
       -Dfile.encoding=UTF-8 \
       -Dsun.jnu.encoding=UTF-8 \
       --enable-url-protocols=http,https \
       -H:+AddAllCharsets \
       --initialize-at-run-time=java.awt,sun.awt,sun.java2d,sun.font,javax.imageio,com.sun.imageio
